{% set hideNav = True %}
{% extends "base.html" %}

{% block main %}
<!-- Banner -->
<!-- Two -->
<section id="two">
	<div class="inner" style = "padding: 20px 0 1em 0;">
		<header class="major">
			<h2>Log In</h2>
		</header>
		{% for error in errors %}
		    <p style="color: red">{{ error }}</p>
		{% endfor %}
		<form action="/addVkey" method="post">
			<p>
			    <p><label for="">URL</label></p>
			    <input type="text" name="url" value="" required>
			</p>
			<p>
			    <p><label for="">Verification Key (pubkey)</label></p>
			    <input type="text" name="vkey" value="">
			</p>
			<input type="submit" value="Submit">
		</form>
	</div>				
</section>
{% endblock %}
